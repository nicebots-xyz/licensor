name: Native Image
on:
  workflow_call:
    inputs:
      matrix-json:
        description: JSON matrix for native-image builds.
        required: false
        default: '{"include":[{"os":"ubuntu-latest","bundle_id":"linux-x86_64","asset_name":"licensor-x86_64-unknown-linux-gnu","native_path":"target/native-image/licensor"},{"os":"ubuntu-24.04-arm","bundle_id":"linux-aarch64","asset_name":"licensor-aarch64-unknown-linux-gnu","native_path":"target/native-image/licensor"},{"os":"macos-15-intel","bundle_id":"macos-x86_64","asset_name":"licensor-x86_64-apple-darwin","native_path":"target/native-image/licensor"},{"os":"macos-latest","bundle_id":"macos-aarch64","asset_name":"licensor-aarch64-apple-darwin","native_path":"target/native-image/licensor"},{"os":"windows-latest","bundle_id":"windows-x86_64","asset_name":"licensor-x86_64-pc-windows.exe","native_path":"target/native-image/licensor.exe","vcvars_arch":"x64"}]}'
        type: string
  workflow_dispatch:
    inputs:
      matrix-json:
        description: JSON matrix for native-image builds. Defaults to a Linux x64 smoke build.
        required: false
        default: '{"include":[{"os":"ubuntu-latest","bundle_id":"linux-x86_64","asset_name":"licensor-x86_64-unknown-linux-gnu","native_path":"target/native-image/licensor"}]}'

permissions:
  contents: read

jobs:
  native-image:
    name: "${{ matrix.bundle_id }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs['matrix-json']) }}

    env:
      JAVA_OPTS: -Xms2g -Xmx2g -Dfile.encoding=UTF-8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: graalvm
          java-version: "21"
          check-latest: false
          cache: sbt

      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
        with:
          disk-cache: false

      - name: Setup Windows C++ toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-vcvars
        with:
          arch: ${{ matrix.vcvars_arch }}

      - name: Build native image
        shell: bash
        run: sbt -v clean nativeImage

      - name: Stage native binary
        shell: bash
        run: |
          set -euo pipefail
          root="${{ matrix.bundle_id }}"
          rm -rf "$root"
          mkdir -p "$root"
          cp "${{ matrix.native_path }}" "$root/${{ matrix.asset_name }}"
          chmod +x "$root/${{ matrix.asset_name }}"
          "$root/${{ matrix.asset_name }}" --help >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.bundle_id }}
          path: ${{ matrix.bundle_id }}
          if-no-files-found: error
