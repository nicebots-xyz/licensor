name: Quality Checks
on:
  workflow_call:

jobs:
  checks:
    name: "Scalafmt + Scalafix"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
          check-latest: false
          cache: sbt

      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
        with:
          disk-cache: false

      - name: Scalafmt Check
        run: sbt scalafmtCheckAll

      - name: Scalafix Check
        run: sbt "scalafixAll --check"

  test:
    name: "Tests (${{ matrix.os }})"
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
          check-latest: false
          cache: sbt

      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
        with:
          disk-cache: false

      - name: Test
        run: sbt test
