name: Release
on:
  push:
    branches: [ master ]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tegami:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tegami.outputs.tag }}
      notes: ${{ steps.tegami.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: tegami
        name: Version or tag
        run: pnpm tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  quality:
    needs: tegami
    if: needs.tegami.outputs.tag != ''
    uses: ./.github/workflows/quality.yaml
    permissions:
      contents: read

  native-image:
    needs: [ tegami, quality ]
    uses: ./.github/workflows/native-image.yaml
    with:
      ref: ${{ needs.tegami.outputs.tag }}
    permissions:
      contents: read

  publish:
    runs-on: ubuntu-latest
    needs: [ tegami, native-image ]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tegami.outputs.tag }}

      - name: Download platform bundle inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: platform-staging
          merge-multiple: false

      - name: Prepare release bundles
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/bundle-release.sh
          packaging/bundle-release.sh "${TAG}" platform-staging
        env:
          TAG: ${{ needs.tegami.outputs.tag }}

      - name: Create the release
        run: |
          gh release create "${TAG}" dist/* --draft --verify-tag --title "${TAG}" --notes "${NOTES}"
          gh release edit "${TAG}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tegami.outputs.tag }}
          NOTES: ${{ needs.tegami.outputs.notes }}
